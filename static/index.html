/* Add @font-face for "Creato Display" here if you self-host it; the stack below falls back cleanly. */
:root{
  --bg:#09090b; --bg2:#101013; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.11); --text:#f4f4f5; --muted:#a1a1aa; --gold:#F5C518; --red:#ff5a5f;
  --t1:#F5C518; --t2:#8FB3FF; --ok:#4ade80;
  --font:"Creato Display",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#1b1708 0%,transparent 60%),var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select{font:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;padding:18px 20px 28px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{font-weight:700;letter-spacing:.14em;font-size:13px}
.logo b{color:var(--gold)}
.badge{font-size:11px;letter-spacing:.08em;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--glass)}
.badge.live{color:var(--ok);border-color:rgba(74,222,128,.35)}
.badge.snap{color:var(--gold);border-color:rgba(245,197,24,.35)}
.sp{flex:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}.stage{height:auto;aspect-ratio:3/2}}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(430px,calc(100vh - 215px),780px);border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#0c1410,#08100c);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block}
.pl{fill:none;stroke:rgba(255,255,255,.17);stroke-width:.35}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.55));pointer-events:none}
.scorebug{position:absolute;left:18px;top:16px;z-index:5;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;
  background:rgba(10,10,12,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sb-team{display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:600;font-size:13px;letter-spacing:.04em}
.sb-team i{width:4px;height:18px;border-radius:2px;display:block}
.sb-score{padding:8px 14px;font-size:20px;font-weight:700;background:var(--glass2);min-width:74px;text-align:center}
.var{position:absolute;z-index:9;left:50%;top:13%;transform:translateX(-50%);min-width:300px;max-width:86%;padding:14px 20px;border-radius:14px;background:rgba(8,8,10,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);text-align:center;display:none;pointer-events:none;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.var .big{font-size:26px;font-weight:800;letter-spacing:.02em}
.vp.anim{animation:in .3s both}.vp.goal .big{color:var(--gold)}.vp.ok .big{color:var(--ok)}.vp.red .big{color:var(--red)}
.vt{display:inline-block;background:#fff;color:#111;font-weight:800;padding:1px 8px;border-radius:5px;margin-right:9px;letter-spacing:.08em}
.var ul{list-style:none;padding:0;margin:10px 0 6px;text-align:left}
.var li{font-size:13.5px;padding:3px 0;color:#a1a1aa}.var li.done{color:var(--ok)}.var li.bad{color:var(--red)}
.var .est{font-size:10.5px;color:var(--muted);margin-top:4px}
.rc{width:8px;height:12px;border-radius:2px;background:var(--red);display:inline-block}
.sb-clock{padding:8px 12px;font-size:13px;color:var(--gold);display:flex;align-items:center;gap:6px;border-left:1px solid var(--line)}
.sb-clock::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}
.paused .sb-clock::before{animation:none;opacity:.35}
@keyframes pulse{50%{opacity:.25}}
.slot{position:absolute;z-index:6;pointer-events:none}
.slot.top{top:16px;left:50%;transform:translateX(-50%);width:min(560px,88%)}
.slot.bottom{left:18px;right:18px;bottom:18px;max-width:760px}
.slot.right{right:14px;top:14px;width:min(290px,34%)}
.slot.left{left:14px;top:76px;width:min(230px,30%)}
.ov{pointer-events:auto;border-radius:16px;border:1px solid var(--line);padding:14px 16px;background:rgba(12,12,15,.66);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:in .45s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}
.ov.out{animation:outa .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes outa{to{opacity:0;transform:translateY(10px)}}
.ov::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--gold))}
.ov.critical{box-shadow:0 0 0 1px rgba(245,197,24,.4),0 14px 50px rgba(245,197,24,.18)}
.kick{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,var(--gold));font-weight:700}
.kick span{color:var(--muted);font-weight:500}
.hl{font-size:18px;line-height:1.2;font-weight:700;margin:6px 0 5px}
.casual .hl{font-size:24px}
.why{font-size:13px;line-height:1.5;color:#d4d4d8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:4px 9px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--gold);font-weight:600}
.chip.pn{color:var(--text)}
.ov.banner{--acc:var(--red);text-align:center;padding:12px 16px}
.ov.banner .kick{justify-content:center}
.ov.banner .hl{font-size:18px}
.stage .mini{display:none}
.stage .slot .why{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mini{width:100%;border-radius:10px;margin:8px 0 2px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ptag{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ptag .av{width:34px;height:34px;border-radius:10px;background:var(--glass2);display:grid;place-items:center;font-weight:700;color:var(--acc)}
.ptag .nm{font-weight:600;font-size:14px}
.ptag .sm{font-size:11.5px;color:var(--muted)}
.pulse-arrow{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.1s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.15s;font-size:13px}
.btn:hover{background:var(--glass2)}
.btn.primary{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:700}
.scrub{position:relative;flex:1;height:30px;display:flex;align-items:center;cursor:pointer}
.scrub .bar{height:4px;background:rgba(255,255,255,.12);border-radius:3px;width:100%;position:relative}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px}
.scrub .half{position:absolute;top:-4px;width:1px;height:12px;background:rgba(255,255,255,.35)}
.mk{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0b0b0d;cursor:pointer;background:#71717a}
.mk.critical{background:var(--gold);width:14px;height:14px}
.mk.high{background:#fbbf24}.mk.medium{background:#a1a1aa}.mk.low{background:#52525b}
.mk:hover{transform:translate(-50%,-50%) scale(1.35)}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:46px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#17130a;font-weight:700}

/* ---------- side ---------- */
.panel{border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 16px;margin-bottom:14px}
.panel h3{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row label{font-size:12.5px;color:#d4d4d8}
select{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;max-width:190px}
.feed{max-height:430px;overflow:auto;padding-right:4px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.03);cursor:pointer}
.it:hover{background:var(--glass2)}
.it .top{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#52525b}
.dot.critical{background:var(--gold);box-shadow:0 0 10px var(--gold)}.dot.high{background:#fbbf24}.dot.medium{background:#a1a1aa}
.it .t{font-size:13.5px;font-weight:600;margin-top:4px}
.det{display:none;margin-top:8px;font-size:12px;color:#d4d4d8;line-height:1.5}
.it.open .det{display:block}
.fac{margin:6px 0;padding:6px 8px;border-left:2px solid var(--gold);background:rgba(245,197,24,.05);border-radius:0 8px 8px 0}
.fac em{font-style:normal;font-size:10.5px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;display:block}
table.ev{width:100%;border-collapse:collapse;margin-top:6px;font-size:11.5px}
table.ev td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ev td:last-child{color:var(--muted);font-size:10.5px}
.ok{color:var(--ok)}.bad{color:var(--red)}
.empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.foot{margin-top:6px;font-size:11px;color:var(--muted)}

/* ---------- full-match additions ---------- */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--gold);color:#17130a;font-weight:700;border-color:var(--gold)}
.cm{max-height:430px;overflow:auto;padding-right:4px}
.cl{display:flex;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.4}
.cl .m{min-width:38px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.cl i{width:3px;border-radius:2px;flex:none}
.cl.big{background:rgba(245,197,24,.07);border-radius:8px}.cl.big b{color:var(--gold)}
.cl.card b{color:var(--red)}
.stats .sr{margin-bottom:11px}
.stats .sl{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.stats .sl span{color:var(--muted)}
.stats .bar2{display:flex;height:5px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.08)}
.stats .bar2 div{height:100%;transition:width .4s}
.tog{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tog .btn{font-size:12px;padding:5px 10px;color:var(--muted)}
.tog .btn.on{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:700}
.btn.sm{padding:7px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pulse-arrow{stroke-dashoffset:0}}
</style>

.side a.on{background:none;color:var(--text);border-left-color:var(--gold)}
.side .panel{border-top:0;margin-top:22px}
.side .row label,.panel h3,.ins-row figcaption,.sv span:first-child{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select{background:var(--card);border:1px solid var(--line2);font-size:13px}
select:focus,.btn:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
/* buttons */
.btn,.seg{background:transparent;border:1px solid var(--line2)}
.btn:hover{background:var(--card2)}
.seg button,.tabs button,.tog .btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.btn.primary,.seg button.on,.tabs button.on,.tog .btn.on{background:var(--gold);border-color:var(--gold);color:#140a06}
.seg button.on{box-shadow:none}
.btn.primary{font-family:var(--disp);font-size:17px;text-transform:uppercase;letter-spacing:.05em;padding:5px 18px}
.tabs{gap:0;border-bottom:1px solid var(--line2);margin:-4px -4px 12px}
.tabs button{background:none!important;border:0!important;border-bottom:2px solid transparent!important;color:var(--muted);padding:10px 4px}
.tabs button.on{color:var(--text)!important;border-bottom-color:var(--gold)!important;font-weight:600}
/* scorebug & overlays */
.scorebug{background:#0b0a09;border:1px solid var(--line2);font-family:var(--disp)}
.sb-team{font-size:18px;font-weight:700;letter-spacing:.04em}
.sb-score{font-family:var(--mono);font-size:20px;background:var(--gold);color:#140a06}
.sb-clock{font-family:var(--mono);font-size:12px;color:var(--text)}
.sb-clock::before{background:var(--red)}
.ov{background:rgba(17,16,14,.92);border:1px solid var(--line2);backdrop-filter:none;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.ov::before{width:3px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}
.hl{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.005em}
.casual .hl{font-size:30px}
.why{color:#cfc7b6}
.chip{background:transparent;border:1px solid var(--line2);font-family:var(--mono);font-size:10.5px}
.var{background:rgba(11,10,9,.95);backdrop-filter:none;border:1px solid var(--line2)}
.var .big{font-family:var(--disp);font-size:34px;text-transform:uppercase}
.vt{background:var(--text);color:var(--bg);font-family:var(--mono);border-radius:2px}
/* transport */
.transport{padding:10px 14px}
.scrub .bar{height:2px;background:var(--line2)}
.mk{border-color:var(--card)}
.time{font-family:var(--mono);color:var(--text)}
/* commentary */
.cl{border-bottom:1px solid var(--line);padding:8px 2px}
.cl .m{font-family:var(--mono);color:var(--gold);font-size:11px}
.cl i{width:2px}
.cl.big{background:rgba(255,91,46,.08)}
.stats .sl{font-family:var(--mono);font-size:11.5px}
.stats .bar2{height:4px;border-radius:0;background:var(--line)}
/* insights */
.ins{margin-top:48px;border-top:1px solid var(--line2);padding-top:22px}
.ins-h h2{font-family:var(--disp);font-size:44px;font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:-.005em}
.ins-live{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--gold);border-color:var(--gold)}
.ins-sec{padding:18px 20px 20px}
.ins-sec>h3{background:none;border:0;border-bottom:2px solid var(--gold);padding:0 0 4px;color:var(--text);font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.sv b{font-family:var(--mono);font-weight:600}
.pl-head b{font-family:var(--disp);font-size:26px;text-transform:uppercase}
.pl-head .av2{border-radius:3px;font-family:var(--mono)}
.badge{font-family:var(--mono)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2)}::-webkit-scrollbar-track{background:transparent}

/* ---------- broadcast lineup intro ---------- */
.rc.lg{width:14px;height:20px;margin-right:10px;vertical-align:-2px}
.lu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(700px 400px at 50% -10%,rgba(255,91,46,.10),transparent 70%),var(--bg);
  font-family:var(--font);padding:22px 26px 18px;transition:opacity .5s,transform .5s}
.lu.gone{opacity:0;transform:scale(1.02);pointer-events:none}
.lu-top{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--gold);padding-bottom:10px;animation:luIn .5s both}
.lu-tag{font-family:var(--mono,monospace);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--gold);color:#140a06;padding:4px 9px;font-weight:700}
.lu-title{font-family:var(--disp,var(--font));font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.lu-meta{margin-left:auto;font-family:var(--mono,monospace);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.lu-body{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:18px;margin-top:16px;min-height:0}
.lu-col{display:flex;flex-direction:column;min-height:0;animation:luIn .55s both}
.lu-col.b{animation-delay:.12s}
.lu-team{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lu-team i{width:6px;height:30px;background:var(--c);transform:skewX(-14deg);display:block}
.lu-team b{flex:1;min-width:0;font-family:var(--disp,var(--font));font-size:24px;font-weight:800;text-transform:uppercase;line-height:1}
.lu-team span{white-space:nowrap;flex:none;font-family:var(--mono,monospace);font-size:11px;color:var(--c);letter-spacing:.08em;margin-left:auto;border:1px solid var(--c);padding:2px 7px}
.lu-list{list-style:none;padding:0;margin:0;overflow:auto}
.lu-list li{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px;animation:luRow .4s both}
.lu-list li em{font-style:normal;font-family:var(--mono,monospace);font-size:12px;width:24px;text-align:right;color:var(--c);font-weight:700}
.lu-list li small{margin-left:auto;font-family:var(--mono,monospace);font-size:10px;color:var(--muted);letter-spacing:.06em}
.lu-bench{margin-top:8px;font-family:var(--mono,monospace);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lu-bench b{color:var(--text);font-weight:500;text-transform:none;font-family:var(--font);font-size:12px}
.lu-pitch{width:100%;height:100%;min-height:0;animation:luIn .6s .2s both}
.lu-pitch .ln{fill:none;stroke:rgba(255,255,255,.16);stroke-width:.4}
.lu-pitch .dt{animation:luDot .45s both}
.lu-pitch text{font-family:var(--mono,monospace);font-weight:700}
.lu-foot{display:flex;align-items:center;gap:12px;margin-top:12px;font-family:var(--mono,monospace);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.lu-foot .btn{margin-left:auto}
@keyframes luIn{from{opacity:0;transform:translateY(12px)}}
@keyframes luRow{from{opacity:0;transform:translateX(-8px)}}
@keyframes luDot{from{opacity:0;transform:scale(.3)}}
.lu-pitch .dt{transform-box:fill-box;transform-origin:center}
@media(max-width:980px){.lu-body{grid-template-columns:1fr 1fr}.lu-pitch{display:none}.lu-title{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="lg-mark"></span>SynqTix<em>/ match intelligence</em></div>
    <span class="badge" id="src"></span><span class="badge" id="cnt"></span>
  </header>

  <div class="grid">
    <nav class="side">
      <a class="on" href="#stage">Live match</a><a href="#insights">Team insights</a><a href="#tabs" data-tab-go="recap">Full-time recap</a>
      <div class="panel">
        <h3 id="h-view">Viewing experience</h3>
        <div class="row"><label id="l-mode">Mode</label><div class="seg" id="mode"></div></div>
        <div class="row"><label id="l-lang">Language</label><div class="seg" id="lang"></div></div>
        <div class="row"><label id="l-team">Favourite club</label><select id="team"></select></div>
        <div class="row"><label id="l-focus">Player focus</label><select id="player"></select></div>
        <div class="row"><label id="l-metric">Focus metric</label><select id="metric"></select></div>
      </div>
    </nav>
    <section>
      <div class="stage paused" id="stage" aria-live="polite">
        <canvas id="pitch" aria-hidden="true"></canvas>
        <div class="var" id="var"></div>
        <div class="scorebug" id="scorebug"></div>
        <div class="lu" id="lineup" hidden></div>
        <div class="slot top" id="s-top"></div>
        <div class="slot right" id="s-right"></div>
        <div class="slot left" id="s-left"></div>
        <div class="slot bottom" id="s-bottom"></div>
      </div>
      <div class="transport">
        <button class="btn primary" id="play">Play</button>
        <button class="btn" id="restart" title="Restart" aria-label="Restart"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="btn sm" id="next" title="Next key moment" aria-label="Next key moment"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l10 7-10 7zM17 5h2.5v14H17z"/></svg></button>
        <div class="scrub" id="scrub"><div class="bar"><div class="fill" id="fill"></div><div class="half" id="half"></div></div></div>
        <div class="time" id="time">00:00</div>
        <div class="seg" id="speed"></div>
      </div>
      <div class="tog" id="tog"></div>
      <div class="foot" id="hint"></div>
    </section>

    <aside>
      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div class="cm" id="comm" style="display:none"></div>
        <div class="feed" id="feed"></div>
        <div class="stats" id="stats" style="display:none"></div>
        <div class="stats" id="recap" style="display:none"></div>
      </div>
    </aside>
  </div>
  <section class="ins" id="insights"><div class="ins-h"><h2 id="ins-t"></h2><span class="ins-live" id="ins-live"></span><div class="seg" id="ins-team"></div></div><div id="ins-body"></div></section>
</div>

<script>
"use strict";
const API = new URLSearchParams(location.search).get("api") || (location.protocol === "file:" ? null : "");
const UI = {
  en:{view:"Viewing experience",feed:"Key moments",mode:"Mode",lang:"Language",team:"Favourite club",focus:"Player focus",metric:"Focus metric",
      off:"Off",none:"None",play:"Play",pause:"Pause",modes:{analyst:"Analyst",casual_fan:"Fan",broadcaster:"Broadcast"},
      empty:"Press Play. Moments appear here as the match unfolds.",why:"Why it matters",evidence:"Evidence",verified:"verified",
      hint:"Click a dot or a commentary line to jump there. Highlights fast-forwards between key moments. VAR panels show the real VAR events in the data (goals, red card, penalties, overturned decisions). Player positions are SIMULATED tracking (2 Hz). Space = play/pause.",numbers:"numbers checked",tabs:{comm:"Commentary",moments:"Key moments",stats:"Stats",recap:"Recap"},recapEmpty:"Recap not available.",recapSrc:{llm:"written by the agent team, every number verified",template:"template recap (no model available)"},names:"Names",lines:"Pass lines",offs:"Offside line",hl:"Highlights",watch:"Watch",nodata:"Full-match data (tracks.js) not loaded.",st:{poss:"Possession (pass share)",shots:"Shots",sot:"On target",xg:"xG",passes:"Passes",acc:"Pass accuracy",fouls:"Fouls",offs:"Offsides"}},
  id:{view:"Pengalaman menonton",feed:"Momen penting",mode:"Mode",lang:"Bahasa",team:"Klub favorit",focus:"Fokus pemain",metric:"Metrik fokus",
      off:"Mati",none:"Tidak ada",play:"Putar",pause:"Jeda",modes:{analyst:"Analis",casual_fan:"Fan",broadcaster:"Siaran"},
      empty:"Tekan Putar. Momen muncul di sini seiring pertandingan berjalan.",why:"Mengapa penting",evidence:"Bukti",verified:"terverifikasi",
      hint:"Klik titik atau baris komentar untuk melompat. Sorotan mempercepat di antara momen penting. Spasi = putar/jeda.",numbers:"angka diperiksa",tabs:{comm:"Komentar",moments:"Momen penting",stats:"Statistik",recap:"Rangkuman"},recapEmpty:"Rangkuman belum tersedia.",recapSrc:{llm:"ditulis tim agent, setiap angka diverifikasi",template:"rangkuman templat (model tidak tersedia)"},names:"Nama",lines:"Garis operan",offs:"Garis offside",hl:"Sorotan",watch:"Tonton",nodata:"Data full match (tracks.js) belum termuat.",st:{poss:"Penguasaan bola (porsi operan)",shots:"Tembakan",sot:"Tepat sasaran",xg:"xG",passes:"Operan",acc:"Akurasi operan",fouls:"Pelanggaran",offs:"Offside"}}
};
const MODES = ["analyst","casual_fan","broadcaster"], LANGS = ["en","id"], SPEEDS = [1,2,5,10,30,60];
const METRICS = ["", "shot_xg", "shot_speed", "team_xg_so_far", "score_after"];
const S = {offs:true,mode:"analyst",lang:"en",team:"",player:"",metric:"",speed:5,tab:"comm",names:false,lines:true,hl:false,rt:0,annot:null,t:0,playing:false,items:[],meta:null,shown:new Set(),slots:{},open:new Set(),src:""};
const $ = id => document.getElementById(id);
const T = () => UI[S.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- data ---------------- */
async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(r.status); return r.json(); }
async function loadMeta(){
  if (API !== null) { try { S.meta = await getJSON(API + "/meta"); return "live API"; } catch(e){} }
  if (window.SNAPSHOTS) { S.meta = window.SNAPSHOTS.meta; return "snapshot"; }
  throw new Error("No API and no snapshot available");
}
function localFilter(list){           // only used in snapshot mode (the API does this server-side)
  const pid = +S.player;
  if (!pid) return list;
  return list.filter(i => i.players.some(p => p.player_id === pid) || i.importance.tier === "critical");
}
async function loadItems(){
  const q = new URLSearchParams({mode:S.mode, lang:S.lang});
  if (S.team) q.set("favorite_team", S.team);
  if (S.player) { q.set("favorite_player_id", S.player); q.set("player_focus", "true"); }
  if (S.metric) q.set("focus_metric", S.metric);
  if (API !== null) {
    try { S.items = await getJSON(API + "/insights?" + q); S.src = "live API"; return; } catch(e){}
  }
  S.items = localFilter(window.SNAPSHOTS[`${S.mode}_${S.lang}`] || []); S.src = "snapshot";
}

/* ---------------- pitch drawing ---------------- */
function pitchSVG(){
  const L = (x1,y1,x2,y2) => `<line class="pl" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const R = (x,y,w,h) => `<rect class="pl" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  return `<rect x="0" y="0" width="120" height="80" fill="#0a130e"/>` +
    [0,1,2,3,4,5].map(i => `<rect x="${i*20}" y="0" width="10" height="80" fill="rgba(255,255,255,.012)"/>`).join("") +
    R(.2,.2,119.6,79.6) + L(60,0,60,80) + `<circle class="pl" cx="60" cy="40" r="10"/>` +
    R(0,18,18,44) + R(0,30,6,20) + R(102,18,18,44) + R(114,30,6,20) +
    `<rect class="pl" x="-2" y="36" width="2" height="8"/><rect class="pl" x="120" y="36" width="2" height="8"/>`;
}
function arrowSVG(a, flip, uid){
  if (!a || a.kind !== "arrow") return "";
  const f = p => flip ? [120 - p[0], 80 - p[1]] : p;
  const [x1,y1] = f(a.from), [x2,y2] = f(a.to), c = flip ? "var(--t2)" : "var(--t1)";
  return `<defs><marker id="m${uid}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker></defs>
    <circle cx="${x1}" cy="${y1}" r="1.6" fill="${c}"/>
    <line class="pulse-arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.1" marker-end="url(#m${uid})"/>
    <text x="${Math.min(112, Math.max(8, x2 + (flip ? 3 : -3)))}" y="${Math.max(5, y2 - 3)}" fill="${c}" font-size="3.6" text-anchor="${flip ? "start" : "end"}" font-weight="700">${esc(a.label || "")}</text>`;
}
let uidc = 0;
function drawStagePitch(item){          // the live pitch is a canvas now: store the arrow, render() draws it
  const a = item && item.overlay.type === "pitch_map" ? (item.overlay.payload.annotations || [])[0] : null;
  const n = performance.now();
  S.annot = a && a.kind === "arrow" ? {a, flip: !!flipFor(item), born: n, until: n + item.timing.ttl_ms} : null;
}
function annots(item){
  const a = (item.overlay.payload.annotations || [])[0];
  return arrowSVG(a, flipFor(item), ++uidc);
}
const flipFor = item => item.overlay.payload.accent_team && S.meta && item.overlay.payload.accent_team !== S.meta.order[0];

/* ---------------- helpers ---------------- */
const teamColor = code => (S.meta && code === S.meta.order[1]) ? "var(--t2)" : "var(--t1)";
const unitFmt = (v,u,label="") => u === "xg" ? (/xg/i.test(label) ? "" : " xG") : u === "pct" ? "%" : u === "km/h" ? " km/h" : "";
const metricChip = m => `<span class="chip">${esc(m.label)} <b>${esc(m.value)}${unitFmt(m.value,m.unit,m.label)}</b></span>`;
function chipsFor(item){
  const byKey = Object.fromEntries(item.metrics.map(m => [m.key, m]));
  const keys = item.overlay.payload.highlight_metric_keys || [];
  const pl = item.players.filter(p => p.role === "actor" || p.role === "keeper").slice(0,2)
    .map(p => `<span class="chip pn">${esc(p.name)}</span>`).join("");
  return pl + keys.map(k => byKey[k] ? metricChip(byKey[k]) : "").join("");
}
function matchClock(s){
  const p1 = S.meta.p1_end_s, half = s <= p1 ? 1 : 2, m = half === 1 ? s : 2700 + (s - p1), cap = half === 1 ? 2700 : 5400;
  const f = v => `${String(Math.floor(v/60)).padStart(2,"0")}:${String(Math.floor(v%60)).padStart(2,"0")}`;
  return {txt: m > cap ? `${f(cap)} +${f(m - cap)}` : f(m), half};
}
function scoreAt(s){
  // score changes when the ball crosses the line: shot time + flight time (from the tracking-era shot duration "d")
  if (!scoreAt.land && typeof TR !== "undefined" && TR.events) scoreAt.land = TR.events.filter(e => e.k === "Shot" && e.o === "Goal").map(e => e.s + (e.d || 0));
  const L_ = scoreAt.land && scoreAt.land.length === S.meta.goals.length ? scoreAt.land : null;
  let sc = "0-0"; S.meta.goals.forEach((g, i) => { if ((L_ ? L_[i] : g.stream_s) <= s) sc = g.score; }); return sc.split("-");
}
function drawScorebug(){
  const [c1,c2] = S.meta.order, tm = S.meta.teams, sc = scoreAt(S.t), mc = matchClock(S.t);
  const rc = c => FM.ready ? FM.reds.filter(r => r.t === c && r.s <= S.t).map(() => '<span class="rc"></span>').join("") : "";
  const html = `<div class="sb-team"><i style="background:var(--t1)"></i>${esc(tm[c1].short.toUpperCase())}${rc(c1)}</div>
     <div class="sb-score">${sc[0]} – ${sc[1]}</div>
     <div class="sb-team">${esc(tm[c2].short.toUpperCase())}${rc(c2)}<i style="background:var(--t2)"></i></div>
     <div class="sb-clock">${mc.txt} · ${mc.half === 1 ? "1H" : "2H"}</div>`;
  if (html !== FM.sbKey) { FM.sbKey = html; $("scorebug").innerHTML = html; }
  if ($("time").textContent !== mc.txt) $("time").textContent = mc.txt;
  $("fill").style.width = (100 * S.t / S.meta.duration_s) + "%";
}

/* ---------------- overlays ---------------- */
const SLOT = {top_banner:"s-top", pitch_map:"s-right", lower_third:"s-bottom", player_tag:"s-left", stat_card:"s-right", ticker:"s-bottom"};
function overlayHTML(item){
  const o = item.overlay, acc = teamColor(o.payload.accent_team), tier = item.importance.tier;
  const kick = `${esc(item.timing.display_clock)} <span>· ${esc(item.trigger.kind.replace("_"," "))}</span>`;
  const cls = `ov ${tier} ${item.audience_mode === "casual_fan" ? "casual" : ""}`;
  if (o.type === "top_banner")
    return `<div class="${cls} banner"><div class="kick">${kick}</div><div class="hl">${esc(item.headline)}</div><div class="why">${esc(item.why_it_matters)}</div></div>`;
  if (o.type === "pitch_map") {
    const a = (o.payload.annotations || [])[0];
    return `<div class="${cls}" style="--acc:${acc}"><div class="kick">${kick}</div>
      <svg class="mini" viewBox="0 0 120 80">${pitchSVG()}${arrowSVG(a, flipFor(item), ++uidc)}</svg>
      <div class="hl" style="font-size:16px">${esc(item.headline)}</div><div class="why">${esc(item.why_it_matters)}</div><div class="chips">${chipsFor(item)}</div></div>`;
  }
  return `<div class="${cls}" style="--acc:${acc}"><div class="kick">${kick}</div><div class="hl">${esc(item.headline)}</div>
    <div class="why">${esc(item.why_it_matters)}</div><div class="chips">${chipsFor(item)}</div></div>`;
}
function showOverlay(item, force){
  const id = SLOT[item.overlay.type] || "s-bottom", slot = $(id), now = performance.now(), cur = S.slots[id];
  if (!force && cur && now < cur.exp && item.overlay.priority < cur.pri) return;   // a higher-priority overlay is still on screen
  slot.innerHTML = overlayHTML(item);
  const el = slot.firstElementChild, ttl = item.timing.ttl_ms;
  S.slots[id] = {pri:item.overlay.priority, exp: now + ttl};
  clearTimeout(S.slots[id].timer);
  S.slots[id].timer = setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 350); }, ttl);
  drawStagePitch(item.overlay.type === "pitch_map" ? item : null);
  showPlayerTag(item);
}

    + row(tt.xg, a.xg.toFixed(2), b.xg.toFixed(2), a.xg, b.xg) + row(tt.passes, a.passes, b.passes, a.passes, b.passes)

const INS={team:null,key:"",view:null};

const insPit='<defs><filter id="hb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.5"/></filter></defs><rect width="120" height="80" fill="#0a0f0d"/><g fill="none" stroke="rgba(45,255,143,.32)" stroke-width=".45"><rect x=".3" y=".3" width="119.4" height="79.4"/><path d="M60 0V80"/><circle cx="60" cy="40" r="9.15"/><rect x=".3" y="18" width="16.5" height="44"/><rect x="103.2" y="18" width="16.5" height="44"/><rect x=".3" y="30" width="5.5" height="20"/><rect x="114.2" y="30" width="5.5" height="20"/></g>';
const insMap = (cap, body, sub, L) => `<figure><figcaption>${cap}</figcaption><svg class="pit" viewBox="0 0 120 80">${insPit}${body}</svg>${sub ? `<figcaption class="dirl">${sub}</figcaption>` : ""}</figure>`;
function insBubbles(pts){
  const g = {}; let mx = 1; for (const [x, y] of pts) { const k = Math.min(11, x / 10 | 0) + "_" + Math.min(4, y / 16 | 0); g[k] = (g[k] || 0) + 1; if (g[k] > mx) mx = g[k]; }
  return Object.entries(g).map(([k, c]) => { const [i, j] = k.split("_").map(Number); return `<circle cx="${i * 10 + 5}" cy="${j * 16 + 8}" r="${(1 + 5.2 * Math.sqrt(c / mx)).toFixed(1)}" fill="#ff5b2e" fill-opacity=".8"/>`; }).join("");
}
const donut = v => `<svg class="dn" viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="none" stroke="#2a2724" stroke-width="5"/><circle cx="22" cy="22" r="17" fill="none" stroke="#ff5b2e" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(v * 1.068).toFixed(1)} 200" transform="rotate(-90 22 22)"/><text x="22" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#e9eeeb">${Math.round(v)}</text></svg>`;

const LEG = '<i class="leg"></i>';
function insHeat(pts){
  const NX = 30, NY = 20, g = new Float32Array(NX * NY);
  for (const [x, y] of pts) { const cx = x / 4, cy = y / 4;
    for (let j = Math.max(0, cy - 3 | 0); j < Math.min(NY, cy + 4); j++) for (let i = Math.max(0, cx - 3 | 0); i < Math.min(NX, cx + 4); i++) { const dx = i + .5 - cx, dy = j + .5 - cy; g[j * NX + i] += Math.exp(-(dx * dx + dy * dy) / 2.2); } }
  let mx = 0; for (const v of g) if (v > mx) mx = v; if (!mx) return "";
  const ramp = v => v < .25 ? "#3a1d14" : v < .5 ? "#9a3a1e" : v < .75 ? "#ff5b2e" : "#ffd166";
  let s = ""; for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) { const v = g[j * NX + i] / mx; if (v < .06) continue; s += `<rect x="${i * 4}" y="${j * 4}" width="4.1" height="4.1" fill="${ramp(v)}" fill-opacity="${(.2 + .8 * v).toFixed(2)}"/>`; }
  return `<g filter="url(#hb)">${s}</g>`;
}
const thirds = pts => { const n = pts.length || 1, f = a => Math.round(100 * pts.filter(a).length / n); return [f(p => p[0] < 40), f(p => p[0] >= 40 && p[0] < 80), f(p => p[0] >= 80)]; };
function insCompute(team, t){
  const grp = {}; ((TR.lineups[team] || {}).players || []).forEach(p => { grp[p.id] = /Goalkeeper/.test(p.pos) ? "gk" : /Back/.test(p.pos) ? "def" : /Midfield/.test(p.pos) ? "mid" : "att"; });
  const D = {pass: 0, pok: 0, high: 0, tk: 0, tkw: 0, intc: 0, offs: 0, fk: 0, cor: 0, fc: 0, fw: 0, sh: 0, sot: 0, tc: {def: [], mid: [], att: []}, all: [], dp: [], pl: "", fl: "", sl: ""};
  const TOUCH = new Set(["Pass", "Carry", "Ball Receipt*", "Dribble", "Shot", "Clearance", "Duel", "Interception", "Block", "Ball Recovery"]);
  for (const e of TR.events) {
    if (e.s > t) break; if (e.t !== team) continue;
    if (TOUCH.has(e.k)) D.all.push([e.x, e.y]);
    if (["Interception", "Ball Recovery", "Clearance", "Block"].includes(e.k) || (e.k === "Duel" && e.ty === "Tackle")) D.dp.push([e.x, e.y]);
    if (TOUCH.has(e.k)) { const g = grp[e.p] || (e.x < 40 ? "def" : e.x < 80 ? "mid" : "att"); if (D.tc[g]) D.tc[g].push([e.x, e.y]); }
    if (e.k === "Pass") { D.pass++; if (e.o === "Complete") D.pok++; if (e.h === "High Pass") D.high++; if (e.ty === "Corner") D.cor++;
      D.pl += `<line x1="${e.x}" y1="${e.y}" x2="${e.ex}" y2="${e.ey}" stroke="${e.o === "Complete" ? "#fff" : "#ff5a5f"}" stroke-opacity=".5" stroke-width=".35"/>`; }
    else if (e.k === "Duel" && e.ty === "Tackle") { D.tk++; if (e.o === "Won") D.tkw++; }
    else if (e.k === "Interception") D.intc++; else if (e.k === "Offside") D.offs++; else if (e.k === "Free Kick Awarded") D.fk++;
    else if (e.k === "Foul Committed") { D.fc++; D.fl += `<circle cx="${e.x}" cy="${e.y}" r="1.4" fill="#ff5a5f" stroke="#fff" stroke-width=".3"/>`; }
    else if (e.k === "Foul Won") { D.fw++; D.fl += `<circle cx="${e.x}" cy="${e.y}" r="1.4" fill="#ff5b2e" stroke="#050607" stroke-width=".3"/>`; }
    else if (e.k === "Shot") { const on = ["Saved", "Goal", "Post"].includes(e.o); D.sh++; if (on) D.sot++;
      D.sl += `<line x1="${e.x}" y1="${e.y}" x2="${e.ex}" y2="${e.ey}" stroke="${on ? "#ff5b2e" : "#ffb020"}" stroke-width=".7"/><circle cx="${e.x}" cy="${e.y}" r="1.2" fill="${on ? "#ff5b2e" : "#ffb020"}"/>`; }
  }
  return D;
}
function renderIns(){
  if (!FM.ready || !TR || !S.meta) return;
  if (INS.view === "player" && !+S.player) INS.view = null;
  $("insights").classList.toggle("show", !!INS.view); if (!INS.view) return;
  const o = S.meta.order; if (!INS.team) INS.team = o[0];
  const key = INS.view + "|" + (INS.view === "player" ? S.player : INS.team) + "|" + S.lang + "|" + Math.floor(S.t / 15); if (key === INS.key) return; INS.key = key;
  $("ins-team").style.display = INS.view === "team" ? "" : "none"; if (INS.view === "player") return renderPlayerIns();
  const L = IL[S.lang] || IL.en, D = insCompute(INS.team, S.t), pct = (a, b) => b ? 100 * a / b : 0;
  const sv = (l, v) => `<div class="sv"><span>${l}</span><b>${v}</b></div>`, dsv = (l, v) => `<div class="sv"><span>${l}</span><span class="dnw">${donut(v)}</span></div>`;
  $("ins-t").textContent = L.h; $("ins-live").textContent = `${L.live} ${minLabel(S.t)}`;
  $("ins-team").innerHTML = o.map(c => `<button class="${c === INS.team ? "on" : ""}" data-ins="${c}">${esc(S.meta.teams[c].short)}</button>`).join("");
  $("ins-body").innerHTML =
    `<div class="ins-sec"><h3>${L.gen}</h3><div class="ins-gen"><div>${sv(L.pass, `${D.pass} (${D.pok})`)}${sv(L.tk, `${D.tk} (${D.tkw})`)}${sv(L.fk, D.fk)}</div><div>${sv(L.int, D.intc)}${sv(L.off, D.offs)}${sv(L.cor, D.cor)}</div></div></div>`
  + (() => { const th = thirds(D.all); return `<div class="ins-sec"><h3>${L.hm}</h3><div class="ins-row">${insMap(L.thm, insHeat(D.all), LEG, L)}<div class="ins-mid">${sv(L.tt, D.all.length)}${sv(L.th, th[0] + "%")}${sv(L.tm, th[1] + "%")}${sv(L.tf, th[2] + "%")}</div>${insMap(L.dhm, insHeat(D.dp), LEG, L)}</div></div>`; })()
  + `<div class="ins-sec"><h3>${L.def}</h3><div class="ins-row">${insMap(L.dtm, insBubbles(D.tc.def), "", L)}<div class="ins-mid">${sv(L.tkn, D.tk)}${dsv(L.tkp, pct(D.tkw, D.tk))}${sv(L.fc, D.fc)}${sv(L.fw, D.fw)}</div>${insMap(L.fm, D.fl, L.fl, L)}</div></div>`
  + `<div class="ins-sec"><h3>${L.mid}</h3><div class="ins-row">${insMap(L.mtm, insBubbles(D.tc.mid), "", L)}<div class="ins-mid">${sv(L.pn, D.pass)}${dsv(L.pp, pct(D.pok, D.pass))}${sv(L.hp, D.high)}</div>${insMap(L.pm, D.pl, "", L)}</div></div>`
  + `<div class="ins-sec"><h3>${L.att}</h3><div class="ins-row">${insMap(L.atm, insBubbles(D.tc.att), "", L)}<div class="ins-mid">${sv(L.sh, D.sh)}${sv(L.sot, D.sot)}${sv(L.soff, D.sh - D.sot)}${dsv(L.sp, pct(D.sot, D.sh))}</div>${insMap(L.sm, D.sl, L.sl, L)}</div></div>`;
}
function renderPlayerIns(){
  const L = Object.assign({}, IL[S.lang] || IL.en, IP[S.lang] || IP.en), pid = +S.player, t = S.t;
  const mp = S.meta.players.find(p => +p.id === pid) || squadList().find(p => +p.id === pid) || {}; let info = null;
  for (const c of Object.keys(TR.lineups)) { const q = (TR.lineups[c].players || []).find(x => x.id === pid); if (q) info = Object.assign({team: c}, q); }
  const name = TR.names[pid] || mp.name || "", team = info ? info.team : mp.team, tn = team && S.meta.teams[team] ? S.meta.teams[team].name : "";
  const TOUCH = new Set(["Pass", "Carry", "Ball Receipt*", "Dribble", "Shot", "Clearance", "Duel", "Interception", "Block", "Ball Recovery"]);
  const D = {pass: 0, pok: 0, tk: 0, tkw: 0, intc: 0, rec: 0, clr: 0, fc: 0, fw: 0, offs: 0, carry: 0, dr: 0, drw: 0, press: 0, sh: 0, sot: 0, goals: 0, xg: 0, pts: [], pl: "", sl: ""};
  for (const e of TR.events) {
    if (e.s > t) break; if (e.p !== pid) continue;
    if (TOUCH.has(e.k)) D.pts.push([e.x, e.y]);
    if (e.k === "Pass") { D.pass++; if (e.o === "Complete") D.pok++; D.pl += `<line x1="${e.x}" y1="${e.y}" x2="${e.ex}" y2="${e.ey}" stroke="${e.o === "Complete" ? "#fff" : "#ff5a5f"}" stroke-opacity=".7" stroke-width=".45"/>`; }
    else if (e.k === "Duel" && e.ty === "Tackle") { D.tk++; if (e.o === "Won") D.tkw++; }
    else if (e.k === "Interception") D.intc++; else if (e.k === "Ball Recovery") D.rec++; else if (e.k === "Clearance") D.clr++;
    else if (e.k === "Foul Committed") D.fc++; else if (e.k === "Foul Won") D.fw++; else if (e.k === "Offside") D.offs++;
    else if (e.k === "Carry") D.carry++; else if (e.k === "Pressure") D.press++;
    else if (e.k === "Dribble") { D.dr++; if (e.o === "Complete") D.drw++; }
    else if (e.k === "Shot") { const on = ["Saved", "Goal", "Post"].includes(e.o); D.sh++; if (on) D.sot++; if (e.o === "Goal") D.goals++; D.xg += e.xg || 0;
      D.sl += `<line x1="${e.x}" y1="${e.y}" x2="${e.ex}" y2="${e.ey}" stroke="${on ? "#ff5b2e" : "#ffb020"}" stroke-width=".7"/><circle cx="${e.x}" cy="${e.y}" r="1.2" fill="${on ? "#ff5b2e" : "#ffb020"}"/>`; }
  }
  const pct = (a, b) => b ? 100 * a / b : 0, sv = (l, v) => `<div class="sv"><span>${l}</span><b>${v}</b></div>`, dsv = (l, v) => `<div class="sv"><span>${l}</span><span class="dnw">${donut(v)}</span></div>`;
  $("ins-t").textContent = L.pi; $("ins-live").textContent = `${L.live} ${minLabel(t)}`;
  $("ins-body").innerHTML =
    `<div class="ins-sec pl-head"><div class="av2">${esc(name.split(" ").map(w => w[0]).join("").slice(0, 2))}</div><div><b>${esc(name)}</b><span>${info ? "#" + info.no + " · " + esc(info.pos) + " · " : ""}${esc(tn)}</span></div></div>`
  + `<div class="ins-sec"><h3>${L.ov}</h3><div class="ins-gen"><div>${sv(L.pass, `${D.pass} (${D.pok})`)}${sv(L.touch, D.pts.length)}${sv(L.carry, D.carry)}${sv(L.drib, `${D.dr} (${D.drw})`)}${sv(L.press, D.press)}${sv(L.rec, D.rec)}</div>`
  + `<div>${sv(L.tk, `${D.tk} (${D.tkw})`)}${sv(L.int, D.intc)}${sv(L.clr, D.clr)}${sv(L.fouls, `${D.fc} / ${D.fw}`)}${sv(L.off, D.offs)}${sv(L.sh + " / " + L.sot, `${D.sh} / ${D.sot}`)}</div></div></div>`
  + (() => { const th = thirds(D.pts); return `<div class="ins-sec"><h3>${L.hm}</h3><div class="ins-row">${insMap(L.thm, insHeat(D.pts), LEG, L)}<div class="ins-mid">${sv(L.tt, D.pts.length)}${sv(L.th, th[0] + "%")}${sv(L.tm, th[1] + "%")}${sv(L.tf, th[2] + "%")}</div><div></div></div></div>`; })()
  + `<div class="ins-sec"><h3>${L.ptm}</h3><div class="ins-row">${insMap(L.ptm, insBubbles(D.pts), "", L)}<div class="ins-mid">${dsv(L.pp, pct(D.pok, D.pass))}${dsv(L.pw, pct(D.tkw, D.tk))}${sv(L.goals, D.goals)}${sv(L.xg, D.xg.toFixed(2))}</div>${insMap(L.ppm, D.pl, "", L)}</div></div>`
  + (D.sh ? `<div class="ins-sec"><h3>${L.sm}</h3><div class="ins-row">${insMap(L.sm, D.sl, L.sl, L)}<div class="ins-mid">${sv(L.sh, D.sh)}${sv(L.sot, D.sot)}${sv(L.goals, D.goals)}${sv(L.xg, D.xg.toFixed(2))}</div><div></div></div></div>` : "");
}

$("ins-team").addEventListener("click", e => { const b = e.target.closest("[data-ins]"); if (b) { INS.team = b.dataset.ins; INS.key = ""; renderIns(); } });
$("player").addEventListener("change", e => { INS.view = e.target.value ? "player" : null; INS.key = ""; renderIns(); if (INS.view) $("insights").scrollIntoView({behavior: "smooth", block: "start"}); });
document.querySelector(".side").addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return;
  if (a.getAttribute("href") === "#insights") { e.preventDefault(); INS.view = INS.view === "team" ? null : "team"; INS.key = ""; renderIns(); if (INS.view) $("insights").scrollIntoView({behavior: "smooth", block: "start"}); } document.querySelectorAll(".side a").forEach(x => x.classList.toggle("on", x === a)); if (a.dataset.tabGo) setTab(a.dataset.tabGo); });

function frame(now){
  const dt = Math.min(.1, (now - (S.last || now)) / 1000); S.last = now;
  if (S.playing) {
    S.rt += dt;
    if (FM.hold) { FM.hold.el += dt; stepHold(); }          // VAR / whistle: the match clock is frozen while it runs
    else { const t0 = S.t; S.t = Math.min(S.meta.duration_s, S.t + dt * effSpeed()); if (FM.ready) fireMoments(t0, now); }
    let changed = false;
    for (const i of S.items) if (i.timing.show_at_stream_offset_s <= S.t && !S.shown.has(i.insight_id)) { S.shown.add(i.insight_id); showOverlay(i); changed = true; }
    if (changed) renderFeed();
    if (S.t >= S.meta.duration_s) setPlaying(false);
  }
  if (!FM.hold) { if (FM.banner && now < FM.banner.until) setVar(FM.banner.html); else if (FM.varKey) setVar(""); }
  drawScorebug();
  if (now - FM.lastCm > 200) { FM.lastCm = now; if (S.tab === "comm") renderComm(); }
  if (S.tab === "stats" && now - FM.lastSt > 300) { FM.lastSt = now; renderStats(); }
  renderIns();
  render(now);
  requestAnimationFrame(frame);
}

(async function init(){
  drawStagePitch(null);
  try { await loadMeta(); } catch(e){ $("feed").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  initFM(); fitCanvas(); new ResizeObserver(fitCanvas).observe($("stage"));
  await refresh(); setTab(S.tab);
  requestAnimationFrame(frame);
})();
</script>
